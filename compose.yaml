services:
  backend:
    build: ./backend
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - certificate-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/demo/admins"]
      interval: 5s
      timeout: 3s
      retries: 12
  frontend:
    profiles: ["ui"]
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
  web:
    profiles: ["ui"]
    image: nginx:1.27-alpine
    ports:
      - "3000:80"
    volumes:
      - ./scripts/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
volumes:
  certificate-data:
  frontend-node-modules:
